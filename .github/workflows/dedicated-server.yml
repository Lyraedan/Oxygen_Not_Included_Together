name: Dedicated Server CI

on:
  push:
    branches: [ main, dedicated-server-complete, dedicated-server-upstream-0.8.1 ]
    paths:
      - 'ONI_Together_DedicatedServer/**'
      - 'Shared/**'
      - 'ONI_Together_API/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.github/workflows/dedicated-server.yml'
  pull_request:
    paths:
      - 'ONI_Together_DedicatedServer/**'
      - 'Shared/**'
      - 'ONI_Together_API/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: |
          dotnet restore ONI_Together_DedicatedServer/ONI_Together_DedicatedServer.csproj
          dotnet restore ONI_Together_DedicatedServer.Tests/ONI_Together_DedicatedServer.Tests.csproj
      - name: Build
        run: dotnet build ONI_Together_DedicatedServer/ONI_Together_DedicatedServer.csproj -c Release --no-restore
      - name: Test
        run: dotnet test ONI_Together_DedicatedServer.Tests/ONI_Together_DedicatedServer.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/test-results.trx'
          if-no-files-found: ignore

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build-test
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, artifact: ONI_Together_DedicatedServer-win-x64 }
          - { os: ubuntu-latest, rid: linux-x64, artifact: ONI_Together_DedicatedServer-linux-x64 }
          - { os: macos-latest, rid: osx-arm64, artifact: ONI_Together_DedicatedServer-osx-arm64 }
          - { os: macos-latest, rid: osx-x64, artifact: ONI_Together_DedicatedServer-osx-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish self-contained
        run: |
          dotnet publish ONI_Together_DedicatedServer/ONI_Together_DedicatedServer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o artifacts/${{ matrix.rid }}
      - name: Add launchers
        shell: bash
        run: |
          if [[ "${{ matrix.rid }}" == win-x64 ]]; then cp ONI_Together_DedicatedServer/packaging/windows/*.bat artifacts/${{ matrix.rid }}/; fi
          if [[ "${{ matrix.rid }}" == linux-x64 ]]; then cp ONI_Together_DedicatedServer/packaging/linux/*.sh artifacts/${{ matrix.rid }}/; chmod +x artifacts/${{ matrix.rid }}/*.sh; fi
          if [[ "${{ matrix.rid }}" == osx-* ]]; then cp ONI_Together_DedicatedServer/packaging/macos/*.command ONI_Together_DedicatedServer/packaging/macos/make-app.sh artifacts/${{ matrix.rid }}/ 2>/dev/null || true; chmod +x artifacts/${{ matrix.rid }}/* 2>/dev/null || true; fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.rid }}

  docker:
    name: Build Docker image
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ONI_Together_DedicatedServer/Dockerfile
          push: false
          tags: oni-together-dedicated-server:latest
